name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r dev-requirements.txt pytest pip-audit
      - name: Tests
        run: python -m pytest tests/ -p no:cacheprovider -q
      - name: Dependency audit (advisory)
        run: pip-audit || true
